<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyber Awareness Quiz — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --ink: #ffffff;
    --btn-text: #0c141c;
    --surface: #ffffff;
    --surface-raised: #eef2f6;
    --line: #dde4ea;
    --signal: #0d9488;
    --signal-soft: rgba(13, 148, 136, 0.1);
    --amber: #c2760c;
    --amber-soft: rgba(194, 118, 12, 0.1);
    --coral: #dc2626;
    --coral-soft: rgba(220, 38, 38, 0.08);
    --text: #101924;
    --text-muted: #47566b;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f5f7fa;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 20px 60px;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: var(--signal);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--signal);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,209,197,.5); }
    70% { box-shadow: 0 0 0 8px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }

  h1 {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .refresh-box {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
  }

  #refresh-btn {
    font-family: var(--mono);
    font-size: 11.5px;
    color: #ffffff;
    background: var(--signal);
    border: none;
    border-radius: 3px;
    padding: 7px 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  #refresh-btn:hover { filter: brightness(1.08); }
  #refresh-btn:disabled { opacity: 0.5; cursor: default; }

  #banner {
    display: none;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--coral);
    background: var(--coral-soft);
    border: 1px solid rgba(255,107,107,0.35);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  @media (max-width: 720px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(16, 25, 36, 0.04);
  }
  .stat .label {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .stat .value {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
  }
  .stat .value.signal { color: var(--signal); }
  .stat .value.amber { color: var(--amber); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(16, 25, 36, 0.04);
  }
  .panel h2 {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 16px;
    font-weight: 600;
  }

  /* Gauge */
  .gauge-track {
    position: relative;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    display: flex;
    margin-bottom: 10px;
  }
  .gauge-track .seg.red { background: var(--coral); flex: 0 0 50%; }
  .gauge-track .seg.amber { background: var(--amber); flex: 0 0 20%; }
  .gauge-track .seg.green { background: var(--signal); flex: 0 0 30%; }
  .gauge-marker {
    position: absolute;
    top: -5px;
    width: 2px;
    height: 24px;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
  }
  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

  canvas { max-height: 260px; }

  .q-block { margin-bottom: 22px; }
  .q-block:last-child { margin-bottom: 0; }
  .q-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .q-row {
    display: grid;
    grid-template-columns: 140px 1fr 70px;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 13.5px;
  }
  .q-row .opt-label {
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .q-bar-track {
    height: 8px;
    background: var(--surface-raised);
    border-radius: 4px;
    overflow: hidden;
  }
  .q-bar-fill {
    height: 100%;
    background: var(--signal);
    border-radius: 4px;
  }
  .q-row .count {
    font-family: var(--mono);
    color: var(--text-muted);
    text-align: right;
  }

  .empty {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="dot"></span>Live Feed</div>
      <h1>Cyber Awareness Quiz — Results Dashboard</h1>
    </div>
    <div class="refresh-box">
      <span id="last-updated">Not loaded yet</span>
      <button id="refresh-btn">Refresh now</button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="stat-row">
    <div class="stat">
      <div class="label">Total Responses</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat">
      <div class="label">Average Score</div>
      <div class="value signal" id="stat-avg">—</div>
    </div>
    <div class="stat">
      <div class="label">Pass Rate</div>
      <div class="value amber" id="stat-pass">—</div>
    </div>
    <div class="stat">
      <div class="label">Top Score</div>
      <div class="value" id="stat-top">—</div>
    </div>
  </div>

  <div class="panel">
    <h2>Class Signal Strength — Average vs. Pass Threshold</h2>
    <div class="gauge-track">
      <div class="seg red"></div>
      <div class="seg amber"></div>
      <div class="seg green"></div>
      <div class="gauge-marker" id="gauge-marker" style="left: 0%"></div>
    </div>
    <div class="gauge-labels">
      <span>0%</span>
      <span id="gauge-threshold-label">Pass: —</span>
      <span>100%</span>
    </div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <h2>Score Distribution</h2>
      <canvas id="chart-scores"></canvas>
    </div>
    <div class="panel">
      <h2>Submissions Over Time</h2>
      <canvas id="chart-time"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Answer Breakdown by Question</h2>
    <div id="question-blocks"><div class="empty">Loading responses…</div></div>
  </div>
</div>

<script>
  let scoreChart = null;
  let timeChart = null;
  let countdownTimer = null;

  function showBanner(msg) {
    const el = document.getElementById("banner");
    el.textContent = msg;
    el.style.display = "block";
  }
  function hideBanner() {
    document.getElementById("banner").style.display = "none";
  }

  function parseScore(raw) {
    if (raw === null || raw === undefined || raw === "") return null;
    if (typeof raw === "number") return { points: raw, total: null };
    const m = String(raw).match(/(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);
    if (m) return { points: parseFloat(m[1]), total: parseFloat(m[2]) };
    const n = parseFloat(raw);
    return isNaN(n) ? null : { points: n, total: null };
  }

  function findScoreColumn(headers) {
    return headers.find((h) => /^score$/i.test(h.trim())) || null;
  }
  function findTimestampColumn(headers) {
    return headers.find((h) => /^timestamp$/i.test(h.trim())) || headers[0];
  }

  function render(data) {
    const headers = data.headers || [];
    const responses = data.responses || [];

    document.getElementById("last-updated").textContent =
      "Updated " + new Date(data.generatedAt || Date.now()).toLocaleTimeString();

    if (responses.length === 0) {
      document.getElementById("question-blocks").innerHTML =
        '<div class="empty">No responses yet — results will appear here as soon as the first submission comes in.</div>';
      document.getElementById("stat-total").textContent = "0";
      document.getElementById("stat-avg").textContent = "—";
      document.getElementById("stat-pass").textContent = "—";
      document.getElementById("stat-top").textContent = "—";
      return;
    }

    const scoreCol = findScoreColumn(headers);
    const tsCol = findTimestampColumn(headers);

    // ---- Score stats ----
    let parsedScores = [];
    let maxTotal = null;
    if (scoreCol) {
      parsedScores = responses
        .map((r) => parseScore(r[scoreCol]))
        .filter((s) => s !== null);
      parsedScores.forEach((s) => {
        if (s.total !== null) maxTotal = Math.max(maxTotal || 0, s.total);
      });
    }

    document.getElementById("stat-total").textContent = responses.length;

    if (parsedScores.length) {
      const avgPoints =
        parsedScores.reduce((a, s) => a + s.points, 0) / parsedScores.length;
      document.getElementById("stat-avg").textContent = maxTotal
        ? avgPoints.toFixed(1) + " / " + maxTotal
        : avgPoints.toFixed(1);

      const topPoints = Math.max(...parsedScores.map((s) => s.points));
      document.getElementById("stat-top").textContent = maxTotal
        ? topPoints + " / " + maxTotal
        : topPoints;

      if (maxTotal) {
        const passCount = parsedScores.filter(
          (s) => s.points / s.total >= CONFIG.PASS_THRESHOLD
        ).length;
        const passPct = Math.round((passCount / parsedScores.length) * 100);
        document.getElementById("stat-pass").textContent = passPct + "%";

        const avgPct = Math.round((avgPoints / maxTotal) * 100);
        document.getElementById("gauge-marker").style.left = avgPct + "%";
        document.getElementById("gauge-threshold-label").textContent =
          "Pass: " + Math.round(CONFIG.PASS_THRESHOLD * 100) + "%";
      } else {
        document.getElementById("stat-pass").textContent = "n/a";
      }
    } else {
      document.getElementById("stat-avg").textContent = "n/a";
      document.getElementById("stat-pass").textContent = "n/a";
      document.getElementById("stat-top").textContent = "n/a";
    }

    // ---- Score distribution chart ----
    if (parsedScores.length) {
      const counts = {};
      parsedScores.forEach((s) => {
        counts[s.points] = (counts[s.points] || 0) + 1;
      });
      const labels = Object.keys(counts)
        .map(Number)
        .sort((a, b) => a - b);

      const ctx = document.getElementById("chart-scores");
      if (scoreChart) scoreChart.destroy();
      scoreChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels.map((l) => (maxTotal ? l + "/" + maxTotal : l)),
          datasets: [
            {
              label: "Respondents",
              data: labels.map((l) => counts[l]),
              backgroundColor: "#0d9488",
              borderRadius: 3,
            },
          ],
        },
        options: chartBaseOptions(false),
      });
    }

    // ---- Submissions over time chart ----
    const dayCounts = {};
    responses.forEach((r) => {
      const raw = r[tsCol];
      if (!raw) return;
      const d = new Date(raw);
      if (isNaN(d)) return;
      const key = d.toISOString().slice(0, 10);
      dayCounts[key] = (dayCounts[key] || 0) + 1;
    });
    const dayLabels = Object.keys(dayCounts).sort();
    const ctxTime = document.getElementById("chart-time");
    if (timeChart) timeChart.destroy();
    timeChart = new Chart(ctxTime, {
      type: "line",
      data: {
        labels: dayLabels,
        datasets: [
          {
            label: "Submissions",
            data: dayLabels.map((d) => dayCounts[d]),
            borderColor: "#c2760c",
            backgroundColor: "rgba(194,118,12,0.12)",
            fill: true,
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: chartBaseOptions(false),
    });

    // ---- Per-question breakdown ----
    const skip = new Set([tsCol, scoreCol, ...(CONFIG.NON_QUESTION_COLUMNS || [])]);
    const questionCols = headers.filter((h) => h && !skip.has(h));

    const container = document.getElementById("question-blocks");
    container.innerHTML = "";

    questionCols.forEach((q) => {
      const counts = {};
      let total = 0;
      responses.forEach((r) => {
        const val = r[q];
        if (val === "" || val === null || val === undefined) return;
        String(val)
          .split(",")
          .map((v) => v.trim())
          .filter(Boolean)
          .forEach((v) => {
            counts[v] = (counts[v] || 0) + 1;
            total += 1;
          });
      });

      const block = document.createElement("div");
      block.className = "q-block";

      const title = document.createElement("div");
      title.className = "q-title";
      title.textContent = q;
      block.appendChild(title);

      Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .forEach(([option, count]) => {
          const pct = total ? Math.round((count / total) * 100) : 0;
          const row = document.createElement("div");
          row.className = "q-row";
          row.innerHTML =
            '<span class="opt-label" title="' + escapeHtml(option) + '">' +
            escapeHtml(option) +
            '</span>' +
            '<span class="q-bar-track"><span class="q-bar-fill" style="width:' +
            pct +
            '%"></span></span>' +
            '<span class="count">' + count + " (" + pct + "%)</span>";
          block.appendChild(row);
        });

      container.appendChild(block);
    });

    if (questionCols.length === 0) {
      container.innerHTML =
        '<div class="empty">No question columns detected. Check CONFIG.NON_QUESTION_COLUMNS in config.js.</div>';
    }
  }

  function chartBaseOptions() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: "#64748b", font: { family: "IBM Plex Mono", size: 10.5 } },
          grid: { color: "#e2e8f0" },
        },
        y: {
          beginAtZero: true,
          ticks: { color: "#64748b", font: { family: "IBM Plex Mono", size: 10.5 }, precision: 0 },
          grid: { color: "#e2e8f0" },
        },
      },
    };
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function loadData() {
    const btn = document.getElementById("refresh-btn");
    btn.disabled = true;
    btn.textContent = "Loading…";
    try {
      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.startsWith("PASTE_")) {
        showBanner(
          "APPS_SCRIPT_URL is not set in config.js yet. Deploy apps-script/Code.gs as a Web App and paste the /exec URL into config.js."
        );
        return;
      }
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      hideBanner();
      render(data);
    } catch (err) {
      console.error(err);
      showBanner("Couldn't load results: " + err.message + ". Check the Apps Script deployment and try Refresh.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Refresh now";
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", loadData);

  loadData();
  setInterval(loadData, CONFIG.REFRESH_INTERVAL_MS || 60000);
</script>
</body>
</html>
