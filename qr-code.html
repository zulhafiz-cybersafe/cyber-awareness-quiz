<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Awareness Quiz — QR Code</title>
<style>
  :root { --accent: #E8582F; --text: #10182B; --text-dim: #667085; --border: #E7E9EE; --bg: #F5F6F8; --surface: #FFFFFF; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 40px 30px;
    text-align: center;
    max-width: 380px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 22px; }
  img { width: 260px; height: 260px; border-radius: 12px; border: 1px solid var(--border); }
  .url-box {
    margin-top: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    background: #FAFAFB;
    border-radius: 8px;
    padding: 8px 10px;
    word-break: break-all;
  }
  .note {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Scan to take the Cyber Awareness Quiz</h1>
  <p class="sub">Works on any phone connected to the same WiFi network as this computer.</p>
  <img id="qrImg" alt="QR code linking to the quiz" />
  <div class="url-box" id="urlBox"></div>
  <p class="note">If this stops working, this machine's local IP may have changed — ask to have the link regenerated.</p>
</div>
<script>
  // Same-origin quiz.html, whatever host/port this page itself is served from —
  // so the QR code always points at wherever this page is actually reachable.
  const quizUrl = new URL("quiz.html", window.location.href).toString();
  document.getElementById("urlBox").textContent = quizUrl;
  document.getElementById("qrImg").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(quizUrl);
</script>
</body>
</html>
